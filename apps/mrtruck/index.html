<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2f35">
<title>MR Truck — Fichas de Serviço</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MR Truck">
<style>
:root{--ink:#0c2a80;--line:#8c939c;--txt:#1b1e22;--mut:#6b737d;--green:#139a5b;--blue:#1d4ed8;--wa:#1fa855;--red:#c8372a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#e7e3dc;color:var(--txt);font-family:Arial,Helvetica,sans-serif;font-size:17px}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:#161616;border-bottom:3px solid #f6c418;display:flex;gap:6px;padding:8px;justify-content:center}
.top button{flex:1;max-width:260px;height:50px;border:none;border-radius:12px;background:#3c424a;color:#cfd5dc;font-size:17px;font-weight:800;cursor:pointer}
.top button.on{background:#f6c418;color:#161616}
.wrap{max-width:640px;margin:0 auto;padding:14px 10px 40px}
@media(min-width:700px){.wrap{max-width:860px}}

/* folha */
.sheet{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:18px 16px 22px}
.hd{display:grid;grid-template-columns:1.1fr 1.4fr;gap:10px 14px;align-items:center;border-bottom:5px solid #3a3a3a;padding-bottom:12px;margin-bottom:6px}
.hlogo{display:flex;align-items:center;justify-content:center}
.hlogo{min-width:0}
.hlogo img{display:block;width:100%;height:auto;max-width:230px;max-height:130px;object-fit:contain}
.hlogo .alt{text-align:center}.hlogo .alt svg{width:54px;height:27px}.hlogo .alt b{display:block;font-size:13px}
.hinfo{text-align:center;display:flex;flex-direction:column;font-size:11.5px;color:#3b3b3b;line-height:1.38}
.hinfo b{font-size:14.5px;color:#161616;margin-bottom:3px;font-weight:800}
.hnum{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1.5px solid #e2e2e2;padding-top:10px}
.hnum .fone{font-weight:800;font-size:14px;color:#161616;white-space:nowrap}
/* linhas de campos iguais ao talão */
.pr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;margin-top:14px}
.pr .fx{display:flex;align-items:flex-end;gap:6px;min-width:0}
.pr label{font-weight:700;white-space:nowrap;font-size:16px;padding-bottom:6px;color:#1b1e22}
.pr input{flex:1;min-width:0;width:100%;border:none;border-bottom:1.5px solid var(--line);border-radius:0;background:transparent;height:36px;padding:0 4px;font-size:17.5px;color:var(--ink);outline:none;font-family:inherit}
.pr input:focus{border-bottom:2.5px solid var(--blue);background:#f5f8ff}
.pr input.pl{font-family:"Courier New",monospace;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fx.g3{flex:3 1 260px}.fx.wdt{flex:1 1 230px}.fx.g2{flex:2 1 210px}.fx.wch{flex:1 1 150px}.fx.wkm{flex:1 1 120px}.fx.wpl{flex:1 1 200px}
.vei.vlin{border:none;padding:0;margin:0;background:none;border-radius:0}
.hnum .pre{font-size:13px;color:#3b3b3b;text-align:center}
.hnum .nbox{display:flex;align-items:flex-end;gap:6px;font-weight:800;font-size:15px}
.hnum input{width:120px;border:none;border-bottom:2.5px solid #161616;background:#fff7d6;font-family:"Courier New",monospace;font-size:21px;font-weight:700;color:#b3141b;text-align:center;height:38px;outline:none;border-radius:4px 4px 0 0}
.hnum input:focus{background:#ffeea3}
.hnum small{display:block;font-size:10.5px;color:#8a6a00;font-weight:800;text-align:right;margin-top:3px}
@media(min-width:600px){.hd{grid-template-columns:1.05fr 1.5fr .95fr}.hnum{grid-column:auto;flex-direction:column;justify-content:center;border-top:0;border-left:1.5px solid #3a3a3a;padding:0 0 0 12px;align-self:stretch;text-align:center}.hnum small{text-align:center}}
.f{display:flex;align-items:flex-end;gap:8px;margin-top:14px}
.f label{font-weight:700;white-space:nowrap;font-size:16px;padding-bottom:6px}
.f input{flex:1;min-width:0;border:none;border-bottom:1.5px solid var(--line);border-radius:0;background:transparent;height:38px;padding:0 4px;font-size:19px;color:var(--ink);outline:none;font-family:inherit}
.f input:focus{border-bottom:2.5px solid var(--blue);background:#f5f8ff}
.f input.pl{font-family:"Courier New",monospace;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 12px}

/* veículos */
.veis{margin-top:12px}
.vei{position:relative;border:1.5px solid #c9ced5;border-radius:10px;padding:4px 12px 12px;margin-top:12px;background:#fcfcfd}
.vei .vt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.vei .x{border:1.5px solid #e2b5b0;color:var(--red);background:#fff;border-radius:8px;height:32px;padding:0 10px;font-size:14px;font-weight:700;cursor:pointer}
.addv{width:100%;margin-top:12px;height:58px;border:2px dashed var(--blue);border-radius:12px;background:#f2f6ff;color:var(--blue);font-size:18px;font-weight:800;cursor:pointer}
.conhecidos{margin-top:12px;background:#fff7e3;border:1.5px solid #f0d89c;border-radius:10px;padding:10px 12px}
.conhecidos p{font-size:14.5px;font-weight:700;color:#6b5420;margin-bottom:8px}
.conhecidos .chips{display:flex;flex-wrap:wrap;gap:8px}
.cp{border:2px solid #222;border-radius:6px;background:#fff;font-family:"Courier New",monospace;font-weight:800;font-size:17px;padding:6px 10px;cursor:pointer}
.cp small{display:block;font-family:Arial;font-weight:600;font-size:11px;color:var(--mut)}
.cp.usado{opacity:.35;pointer-events:none}

.sec{font-weight:700;font-size:16px;margin-top:22px}
textarea.ruled{display:block;width:100%;border:none;outline:none;resize:vertical;font-size:16.5px;color:var(--ink);font-family:inherit;padding:0 4px;line-height:30px;height:362px;background:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--line) 29px,var(--line) 30px);background-attachment:local}
textarea.ruled:focus{background-color:#f5f8ff}
.rod{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;margin-top:34px;font-size:16px}
.rod u{text-decoration:none;border-bottom:1.5px solid var(--line);color:var(--ink);padding:0 8px;font-size:18px}
.ass{margin-top:16px}
.assl{width:62%;margin:46px 0 6px auto;text-align:center}
.assl .lnass{border-top:1.5px solid #333;height:0}
.assl span{display:block;font-weight:700;font-size:15px;margin-top:5px}
.padwrap{position:relative;border:2px dashed #b2b9c2;border-radius:10px;overflow:hidden;background:#fff}
#pad{display:block;width:100%;height:150px;touch-action:none}
#padHint{position:absolute;inset:0;display:grid;place-items:center;color:#a5adb7;font-size:16px;pointer-events:none}
.ass .ln{border-top:1.5px solid #333;margin:0 20px;text-align:center;font-weight:700;padding-top:4px;font-size:15px}
.ass .apaga{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:15px;padding:8px;cursor:pointer;display:block;margin:0 auto}
.ass img{display:block;max-width:80%;max-height:110px;margin:0 auto}

.B{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;border:none;border-radius:16px;font-size:21px;font-weight:800;color:#fff;background:var(--green);cursor:pointer;margin-top:14px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.B:active{transform:translateY(2px);box-shadow:none}
.B.blue{background:var(--blue)}.B.wa{background:var(--wa)}
.B.white{background:#fff;color:#222;border:2px solid #cfd4da;box-shadow:none}
.lnk{display:block;width:100%;background:none;border:none;color:var(--mut);text-decoration:underline;font-size:16px;padding:14px;cursor:pointer}
.err{background:#fde8e6;color:#9b2216;border-radius:12px;padding:12px 14px;font-weight:700;margin-top:14px}

/* lista */
.busca{width:100%;height:58px;border-radius:14px;border:2px solid #cfd4da;padding:0 16px;font-size:19px;outline:none;margin-bottom:12px;background:#fff}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
.card b{font-size:19px}
.card .s{color:var(--mut);font-size:15px;margin-top:3px}
.placas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.placa{border:2px solid #222;border-radius:5px;font-family:"Courier New",monospace;font-weight:800;font-size:15px;padding:2px 7px;background:#fff}
.h2{font-size:14px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px}
.fic{display:flex;justify-content:space-between;gap:10px;align-items:center}
.fic .n{font-family:"Courier New",monospace;font-weight:800;color:#b3141b}
.back{background:none;border:none;color:var(--blue);font-size:18px;font-weight:800;padding:4px 0 12px;cursor:pointer}
.ok{background:#e1f5ea;color:#0e6e41;border-radius:14px;padding:16px;text-align:center;font-size:20px;font-weight:800;margin-bottom:12px}
.paperBox{background:#cfd4da;border-radius:10px;padding:8px;overflow:hidden}
.paperScale{transform-origin:top left}
.empty{text-align:center;color:var(--mut);padding:26px;border:2px dashed #c3c9d0;border-radius:14px}
.ex{background:#fff7e3;border:1.5px solid #f0d89c;border-radius:12px;padding:12px 14px;font-size:15px;color:#6b5420;margin-bottom:12px}
.ex button{margin-top:8px;background:#8a5a00;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.gear{display:block;margin:24px auto 0;background:none;border:none;color:#8a9097;font-size:14px;text-decoration:underline;cursor:pointer}

#modal{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#modal h3{font-size:21px;margin-bottom:10px}
#modal label{display:block;font-weight:700;margin:10px 0 4px}
#modal input{width:100%;height:52px;border:2px solid #cfd4da;border-radius:12px;padding:0 12px;font-size:17px;outline:none}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;font-weight:800;padding:14px 20px;border-radius:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-size:17px;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#instalar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:10px;background:#1d4ed8;color:#fff;border:none;border-radius:16px;padding:16px 22px;font-size:18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap}
#instalar.show{display:flex}
#instalar .fx{background:rgba(255,255,255,.2);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-size:15px;margin-left:4px}
/* acesso / administrador */
.center{text-align:center;padding:80px 0;color:var(--mut)}
.spin{width:44px;height:44px;border:4px solid #cfd4da;border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.lgbox{margin-top:24px;padding:26px 20px}
.lglogo{width:90px;height:90px;border-radius:22px;background:#2b2f35;display:grid;place-items:center;margin:0 auto 12px}
.lglogo svg{width:62px;height:31px}.lglogo svg *{stroke:#fff}.lglogo svg circle{fill:#2b2f35}
.lgt{font-size:25px;text-align:center;margin:6px 0}
.lgs{text-align:center;color:var(--mut);font-size:16.5px;margin-bottom:18px;line-height:1.4}
.lbl2{display:block;font-weight:800;margin:12px 0 6px}
.in2{width:100%;height:58px;border:2px solid #cfd4da;border-radius:14px;padding:0 14px;font-size:19px;outline:none}
.in2:focus{border-color:var(--blue)}
.rodape{text-align:center;color:var(--mut);font-size:14px;margin-top:18px}.rodape a{color:var(--blue)}
.mini{color:#9aa1a9;font-size:12.5px;text-align:center;margin-top:10px}
.okm{background:#e1f5ea;color:#0e6e41;border-radius:12px;padding:12px 14px;font-weight:700;margin-top:14px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:6px}
.mtop b{display:block;font-size:18px}.mtop span{color:var(--mut);font-size:13.5px}
.st{font-size:13px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap}
.st.ok{background:#e1f5ea;color:#0e6e41}.st.no{background:#fde8e6;color:#9b2216}.st.te{background:#fff3d6;color:#8a5a00}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ab{border:2px solid #cfd4da;background:#fff;border-radius:10px;padding:9px 12px;font-size:14.5px;font-weight:800;cursor:pointer}
.ab.blue{background:var(--blue);border-color:var(--blue);color:#fff}.ab.green{background:var(--green);border-color:var(--green);color:#fff}.ab.red{color:var(--red);border-color:#f0c2bc}
#modal select.sel{width:100%;height:52px;border:2px solid #cfd4da;border-radius:12px;padding:0 10px;font-size:17px;background:#fff}
#mbar{display:none;justify-content:space-between;align-items:center;gap:8px;background:#fff3d6;color:#6b4a00;padding:8px 14px;font-size:15px}
#mbar button{background:#8a5a00;color:#fff;border:none;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
/* linhas com valor (serviço / peças) */
.sech{display:flex;justify-content:space-between;align-items:flex-end;font-weight:700;font-size:16px;margin-top:22px;padding-bottom:2px}
.sech small{font-size:12.5px;color:var(--mut);width:104px;text-align:center}
.ln{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:30px}
.ln .ld{flex:1;min-width:0;border:none;background:transparent;font-size:16px;color:var(--ink);outline:none;padding:4px 4px 0;font-family:inherit}
.ln .lv{width:104px;border:none;border-left:1px solid #d5d9df;background:#fffbea;font-size:15.5px;text-align:right;color:var(--ink);outline:none;padding:4px 6px 0;font-family:inherit}
.ln .ld:focus,.ln .lv:focus{background:#eef3ff}
.ln .lv::placeholder{color:#c9c2a5}
.grip{display:flex;justify-content:flex-end;margin-top:2px}
.grip span{width:52px;height:24px;display:grid;place-items:center;color:#7d8590;cursor:ns-resize;touch-action:none;user-select:none;font-size:15px;letter-spacing:-2px;border-radius:6px;background:#f2f2ef}
.grip span:active{background:#e6e2d4}
.tot{text-align:right;font-weight:800;font-size:15.5px;margin-top:4px;color:#161616}
.tot.geral{font-size:18px;border-top:2px solid #161616;padding-top:6px;margin-top:12px}
/* currículo do caminhão / OS em aberto */
.hist{margin-top:10px;background:#fff7d6;border:1.5px solid #f0d27a;border-radius:10px;padding:10px 12px;font-size:15px;color:#5a4300}
.hist button,.vcur{margin-top:8px;background:#161616;color:#f6c418;border:none;border-radius:10px;padding:9px 14px;font-weight:800;font-size:15px;cursor:pointer}
.okbar{background:#e1f5ea;color:#0e6e41;border-radius:14px;padding:14px;text-align:center;font-size:18px;font-weight:800;margin-top:14px}
.cvh{display:flex;gap:14px;align-items:center}
.cvh .placa{font-size:24px;padding:4px 10px}
.cvh b{display:block;font-size:19px}.cvh span.s{display:block;color:var(--mut);font-size:15px}
.cvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cvs div{background:#f6f6f4;border-radius:12px;padding:10px 6px;text-align:center}
.cvs b{display:block;font-size:18px}.cvs span{font-size:12.5px;color:var(--mut)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:3px;background:#d9d4c7;border-radius:3px}
.tli{position:relative;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
.tli:before{content:"";position:absolute;left:-21px;top:16px;width:14px;height:14px;border-radius:50%;background:#139a5b;border:3px solid #e7e3dc}
.tli.ab:before{background:#e0a400}
.tlh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tlh b{font-size:17px}
.tls{margin-top:6px;white-space:pre-line;font-size:16px}
.tlp{margin-top:6px;color:var(--mut);font-size:14.5px}
.tlf{margin-top:6px;color:var(--mut);font-size:13.5px}
.abert{border-left:5px solid #e0a400}
.ctab{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.ctab th{background:#161616;color:#f6c418;text-align:left;padding:6px;font-size:11.5px}
.ctab td{border-bottom:1px solid #bbb;padding:6px;vertical-align:top;white-space:pre-line}
.ctit{font-size:18px;font-weight:800;margin:4px 0 2px}
/* impressão (A4 igual ao talão) */
.paper{width:760px;background:#fff;color:#151515;font-family:Arial,Helvetica,sans-serif;padding:30px 36px 34px;font-size:13px;line-height:1.3}
.ph{display:grid;grid-template-columns:215px 1fr 190px;align-items:center;gap:10px;border-bottom:5px solid #3a3a3a;padding-bottom:10px;margin-bottom:12px}
.plogo{display:flex;align-items:center;justify-content:center;min-height:80px}
.plogo img{max-width:205px;max-height:118px}
.defmark{text-align:center}
.defmark .t{display:inline-flex;border:2.5px solid #222;font-weight:900;font-size:19px}
.defmark .t span{padding:2px 6px}.defmark .t span+span{background:#222;color:#fff}
.defmark small{display:block;font-size:8.5px;font-weight:700;margin-top:3px;color:#333}
.defmark svg{width:70px;height:34px;display:block;margin:0 auto 4px}
.pinfo{text-align:center;display:flex;flex-direction:column;font-size:11.5px;color:#333}
.pinfo b{font-size:15.5px;color:#222;margin-bottom:4px}
.pnum{border-left:1.5px solid #333;padding-left:14px;font-size:12.5px;display:flex;flex-direction:column;gap:14px;text-align:center;align-self:stretch;justify-content:center}
.pnum .nn b{font-family:"Courier New",monospace;font-size:19px;color:#b3141b;border-bottom:1px solid #333;padding:0 8px}
.prow{display:flex;align-items:flex-end;gap:6px;margin:10px 0}
.prow label{font-weight:700;white-space:nowrap;color:#222}
.prow .v{border-bottom:1px solid #555;min-height:20px;padding:0 4px 1px;color:#0c2a80;font-size:14px;white-space:nowrap;overflow:hidden}
.prow .grow{flex:1}.prow .w1{width:150px}.prow .w2{width:96px}.prow .w3{width:110px}
.psec{font-weight:700;margin-top:14px;color:#222;display:flex;justify-content:space-between}.psec small{width:110px;text-align:center;font-size:11px;font-weight:700}
.pl{box-sizing:border-box;border-bottom:1px solid #8a8a8a;min-height:27px;color:#0c2a80;font-size:13.5px;line-height:19px;display:flex}.pl .pd{flex:1;padding:6px 4px 1px}.pl .pv{width:110px;border-left:1px solid #b9b9b9;text-align:right;padding:6px 6px 1px;white-space:nowrap}.ptot{text-align:right;font-weight:700;font-size:13px;padding:4px 6px 0;color:#151515}.ptot.g{font-size:14.5px;border-top:2px solid #333;margin-top:8px;padding-top:5px}
.pfoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:48px;gap:20px}
.pdate{font-size:14px;white-space:nowrap}
.pdate u{text-decoration:none;border-bottom:1px solid #444;padding:0 8px;color:#0c2a80;display:inline-block;min-width:30px;text-align:center}
.psig{width:290px;text-align:center}
.psig img{max-height:72px;max-width:270px;display:block;margin:0 auto -8px}
.psig .sl{border-bottom:1px solid #333;height:1px}
.psig span{display:block;font-weight:700;margin-top:4px}

<body>
<div id="shell">
  <div class="top" style="display:none"><button id="tNova" data-act="nova">📝 Nova ficha</button><button id="tSalvas" data-act="salvas">👥 Clientes</button></div>

</div>

<div id="printArea"></div>
<button id="instalar"><span>💻 Instalar no computador</span><span class="fx" id="instalarX" title="Agora não">✕</span></button>

<script type="module">
import {initializeApp,deleteApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,serverTimestamp,Timestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ====== Firebase (mesmo projeto do Ponto Eletrônico) ======
   Quem é administrador é decidido pelas regras do Firebase (mesma regra do Ponto):
   se a conta consegue listar todas as oficinas, ela é o administrador. */
const firebaseConfig={apiKey:'AIzaSyBZyZ4Dqs0BI5VSsm3HB2TNGpk7Z7330CE',authDomain:'escritorio-c3acb.firebaseapp.com',projectId:'escritorio-c3acb',storageBucket:'escritorio-c3acb.firebasestorage.app',messagingSenderId:'752996396852',appId:'1:752996396852:web:13569631f01d301d5a3f61'};
const DIAS_TESTE=7;
const WA_SUPORTE='5514988324456';
const app=initializeApp(firebaseConfig),auth=getAuth(app);
let fs;try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){fs=initializeFirestore(app,{});}

/* ====== utilidades ====== */
const KEY_LOCAL='mrtruck_ficha_papel_v1'; // dados da versão antiga (só no aparelho): sobem sozinhos para a nuvem
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad6=n=>typeof n==='number'?String(n).padStart(6,'0'):String(n??'');
const normPlaca=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const int=s=>parseInt(String(s||'').replace(/\D/g,''))||0;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const hoje=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);};
const dt=s=>s?new Date(s).toLocaleDateString('pt-BR'):'';
const hr=s=>s?new Date(s).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const linhas=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const kmTxt=k=>k?(+k).toLocaleString('pt-BR'):'';
const nomeKey=n=>String(n||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const nomeCurto=n=>String(n||'').replace(/\s*[-–]?\s*\b(LTDA|EIRELI|ME|EPP|S\/?A)\b\.?/gi,'').trim();
const truckSvg=`<svg viewBox="0 0 64 32" fill="none" stroke="#222" stroke-width="2.6"><path d="M4 6h34v18H4zM38 11h12l8 8v5H38z"/><circle cx="14" cy="25" r="4" fill="#fff"/><circle cx="48" cy="25" r="4" fill="#fff"/></svg>`;
const tsMs=t=>t&&t.toMillis?t.toMillis():(t?+new Date(t):0);
const liberada=o=>!!o&&(o.status==='ativo'||(o.status==='teste'&&tsMs(o.fimTeste)>Date.now()));
const soNum=s=>String(s||'').replace(/\D/g,'');
const negado=e=>/permission-denied/.test((e&&e.code)||'');
const erroTxt=e=>{const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'E-mail ou senha errados.';
  if(/invalid-email/.test(c))return 'Esse e-mail não está certo.';
  if(/too-many-requests/.test(c))return 'Muitas tentativas. Espere uns minutos e tente de novo.';
  if(/network|unavailable/.test(c))return 'Sem internet. Confira a conexão.';
  if(/email-already-in-use/.test(c))return 'Esse e-mail já tem conta. Use outro e-mail para esta oficina.';
  if(/weak-password/.test(c))return 'A senha precisa ter pelo menos 6 letras ou números.';
  if(/permission-denied/.test(c))return 'Sem permissão para isso.';
  return 'Não deu certo ('+(c||(e&&e.message)||'erro')+').';};

/* ====== estado ====== */
let USER=null,MODO=null;      // MODO: 'master' (administrador) | 'dono' (oficina)
let OF=null,OFDOC=null,OFICINAS=[];
let db={config:{},clientes:[],fichas:[]};
let unsubs=[],unsubMaster=null;
let tela={v:'carregando'};
let edit=null,F=null,CAD=null;
const CONFIG_PADRAO={nome:'MR Truck Service LTDA - ME',slogan:'Mecatrônica Especializada em Caminhões Volvo',end1:'Rua Vitorio Maziero 00930',end2:'Jardim Bom Pastor II',end3:'São Manuel - SP - CEP 18.654-146',cnpj:'21.749.210/0001-57',ie:'649.042.714.110',fone:'(14) 3841 5980',cidade:'São Manuel'};
const CAMPOS_CFG=['nome','slogan','end1','end2','end3','cnpj','ie','fone','cidade','logo'];

const cliById=id=>db.clientes.find(c=>c.id===id);
const cliByNome=n=>db.clientes.find(c=>nomeKey(c.nome)===nomeKey(n));
const fichaById=id=>db.fichas.find(f=>f.id===id);
const NL=12;
const money=v=>{v=String(v??'').trim();if(!v)return 0;v=v.replace(/[^\d,.-]/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isNaN(n)?0:n;};
const brl=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const novasLinhas=n=>Array.from({length:n},()=>({d:'',v:''}));
const itensDe=(f,k)=>{const it=f[k+'Itens'];if(Array.isArray(it)&&it.length)return it.map(x=>({d:x.d||'',v:x.v||''}));return linhas(f[k]).map(d=>({d,v:''}));};
const somaItens=it=>it.reduce((t,x)=>t+money(x.v),0);
const totalFicha=f=>somaItens(itensDe(f,'servico'))+somaItens(itensDe(f,'pecas'));
const statusDe=f=>f.status==='finalizada'?'finalizada':'aberta';
const fichasDoCaminhao=p=>db.fichas.filter(f=>(f.veiculos||[]).some(v=>v.placa===p)).sort((a,b)=>String(b.data).localeCompare(String(a.data))||String(b.num).localeCompare(String(a.num),undefined,{numeric:true}));
const caminhaoInfo=p=>{for(const c of db.clientes){const v=(c.veiculos||[]).find(x=>x.placa===p);if(v)return{c,v};}const f=fichasDoCaminhao(p)[0];return{c:f?cliById(f.cid)||{nome:f.cliente}:{},v:f?(f.veiculos||[]).find(x=>x.placa===p)||{}:{}};};
const donoDaPlaca=p=>db.clientes.find(c=>(c.veiculos||[]).some(v=>v.placa===p));

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show');}
function closeModal(){$('#modal').classList.remove('show');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function novoForm(){F={num:'',cliente:'',motorista:'',data:hoje(),veiculos:[{placa:'',modelo:'',chassi:'',km:''}],itens:{servico:novasLinhas(NL),pecas:novasLinhas(NL)},assinatura:null};edit=null;}
novoForm();

/* ====== gravação na nuvem (sem internet, guarda e sobe quando voltar) ====== */
const falhou=e=>{console.error(e);toast('⚠️ '+erroTxt(e));};
const refCli=id=>doc(fs,'os_oficinas',OF,'clientes',id);
const refFicha=id=>doc(fs,'os_oficinas',OF,'fichas',id);
function gravaCli(c){const {id,...d}=c;setDoc(refCli(id),{...d,atualizado:serverTimestamp()}).catch(falhou);}
function gravaFicha(f){const {id,...d}=f;setDoc(refFicha(id),{...d,atualizado:serverTimestamp()}).catch(falhou);}
function apagaFicha(id){deleteDoc(refFicha(id)).catch(falhou);}
function gravaConfig(){const d={};CAMPOS_CFG.forEach(k=>d[k]=db.config[k]??null);updateDoc(doc(fs,'os_oficinas',OF),d).catch(falhou);}

/* ====== entrar / sair ====== */
function limpar(){unsubs.forEach(u=>{try{u();}catch(_){}});unsubs=[];db={config:{},clientes:[],fichas:[]};OF=null;OFDOC=null;}
onAuthStateChanged(auth,async u=>{
  limpar();if(unsubMaster){unsubMaster();unsubMaster=null;}
  USER=u;MODO=null;
  if(!u){tela={v:'login'};render();return;}
  tela={v:'carregando'};render();
  try{
    const p=await getDoc(doc(fs,'os_usuarios',u.uid));
    if(p.exists()){MODO='dono';abrirOficina(p.data().oficinaId);return;}
  }catch(e){if(!negado(e)){tela={v:'erro',msg:erroTxt(e)};render();return;}}
  abrirPainelMaster(true); // sem oficina ligada: confere se é o administrador
});
function abrirPainelMaster(testando){
  limpar();if(unsubMaster)unsubMaster();
  if(!testando){tela={v:'master'};render();}
  unsubMaster=onSnapshot(collection(fs,'os_oficinas'),s=>{
    MODO='master';
    OFICINAS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    if(tela.v==='master'||tela.v==='carregando'){tela={v:'master'};render();}
  },e=>{MODO=null;tela=negado(e)?{v:'semCadastro'}:{v:'erro',msg:erroTxt(e)};render();});
}
function abrirOficina(id){
  limpar();OF=id;tela={v:'carregando'};render();
  const ok={};const pronto=k=>{if(ok[k])return;ok[k]=1;if(ok.o&&ok.c&&ok.f&&tela.v==='carregando'){tela=liberadaOuMaster()?{v:'nova'}:{v:'bloqueado'};render();if(MODO==='dono')migrarLocal();}};
  const erro=e=>{tela={v:'erro',msg:erroTxt(e)};render();};
  unsubs.push(onSnapshot(doc(fs,'os_oficinas',id),s=>{
    OFDOC=s.exists()?s.data():null;db.config={...(OFDOC||{})};
    // correção pedida em 18/11/2026: CEP novo da MR Truck no cabeçalho
    if(OFDOC&&/mr\s*truck/i.test(OFDOC.nome||'')&&/18650-000/.test(OFDOC.end3||'')){const n=OFDOC.end3.replace('18650-000','18.654-146');db.config.end3=n;updateDoc(doc(fs,'os_oficinas',id),{end3:n}).catch(()=>{});}
    if(!OFDOC){tela={v:'semCadastro'};render();return;}
    if(tela.v!=='carregando'){
      if(!liberadaOuMaster()){tela={v:'bloqueado'};render();}
      else if(tela.v==='bloqueado'){tela={v:'nova'};render();}
      else pintaTopo();
    }
    pronto('o');
  },erro));
  unsubs.push(onSnapshot(collection(fs,'os_oficinas',id,'clientes'),s=>{
    db.clientes=s.docs.map(d=>({id:d.id,veiculos:[],...d.data()}));
    if(tela.v==='salvas')atualizaLista();pronto('c');
  },erro));
  unsubs.push(onSnapshot(collection(fs,'os_oficinas',id,'fichas'),s=>{
    db.fichas=s.docs.map(d=>({id:d.id,...d.data()}));
    if(tela.v==='salvas'){if((document.activeElement||{}).id==='busca')atualizaLista();else{const y=scrollY;render();scrollTo(0,y);}}else if(tela.v==='curriculo'){const y=scrollY;render();scrollTo(0,y);}pronto('f');
  },erro));
}
const liberadaOuMaster=()=>MODO==='master'||liberada(OFDOC);
function atualizaLista(){const b=$('#busca');if(b&&$('#lista'))$('#lista').innerHTML=listaClientes(b.value);}
function migrarLocal(){ // fichas da versão antiga (guardadas só neste aparelho) sobem uma vez
  try{
    const flag='mrtruck_migrado_'+OF;if(localStorage.getItem(flag))return;
    const s=localStorage.getItem(KEY_LOCAL);localStorage.setItem(flag,'1');if(!s)return;
    const old=JSON.parse(s);if(old.exemplo||!(old.clientes||[]).length)return;
    const b=writeBatch(fs);let n=0;
    (old.clientes||[]).forEach(c=>{if(!cliById(c.id)){const {id,...d}=c;b.set(refCli(id),d);n++;}});
    (old.fichas||[]).forEach(f=>{if(!fichaById(f.id)){const {id,...d}=f;d.num=pad6(d.num);b.set(refFicha(id),d);n++;}});
    if(n)b.commit().then(()=>toast('✅ Fichas deste aparelho foram para a nuvem')).catch(falhou);
  }catch(e){console.error(e);}
}

/* ====== telas de acesso ====== */
function vCarregando(){return `<div class="center"><div class="spin"></div><p>Abrindo…</p></div>`;}
function vLogin(){
  return `<div class="sheet lgbox">
    <div class="lglogo">${truckSvg}</div>
    <h1 class="lgt">Ficha de Serviço</h1>
    <p class="lgs">Entre com o e-mail e a senha da oficina</p>
    <form id="fLogin" autocomplete="on">
      <label class="lbl2">E-mail</label><input class="in2" id="lEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="none">
      <label class="lbl2">Senha</label><input class="in2" id="lSenha" type="password" autocomplete="current-password">

  </div>
  <p class="rodape">Sistema da <b>Keller IA</b> · <a href="https://wa.me/${WA_SUPORTE}" target="_blank" rel="noopener">pedir acesso no WhatsApp</a></p>`;
}
function vSemCadastro(){return `<div class="sheet lgbox"><h1 class="lgt">Conta sem oficina</h1><p class="lgs">Este e-mail ainda não está ligado a nenhuma oficina. Fale com a Keller IA para liberar.</p>
  <a class="B wa" href="https://wa.me/${WA_SUPORTE}" target="_blank" rel="noopener">📲 FALAR NO WHATSAPP</a><button class="lnk" data-act="sair">Sair</button>
  <p class="mini">Administrador: se você entrou com a sua conta e caiu aqui, as regras deste app ainda não estão publicadas no Firebase (arquivo apps/mrtruck-teste/firestore.rules — já publicado).</p></div>`;}
function vBloqueado(){
  const o=OFDOC||{},venceu=o.status==='teste';
  return `<div class="sheet lgbox"><div style="font-size:60px;text-align:center">🔒</div><h1 class="lgt">${venceu?'O período de teste acabou':'Acesso pausado'}</h1>

  <a class="B wa" href="https://wa.me/${WA_SUPORTE}?text=${encodeURIComponent('Olá! Quero liberar o acesso das fichas da '+(o.nome||'oficina'))}" target="_blank" rel="noopener">📲 LIBERAR NO WHATSAPP</a>
  <button class="lnk" data-act="sair">Sair</button></div>`;
}
function vErro(){return `<div class="sheet lgbox"><h1 class="lgt">Algo deu errado</h1><p class="lgs">${esc(tela.msg)}</p>
  <button class="B" data-act="recarregar">TENTAR DE NOVO</button><button class="lnk" data-act="sair">Sair</button></div>`;}

/* ====== painel do administrador ====== */
function stTxt(o){
  if(o.status==='ativo')return '<span class="st ok">✅ Liberado</span>';
  if(o.status==='bloqueado')return '<span class="st no">⛔ Bloqueado</span>';
  const ms=tsMs(o.fimTeste);return ms>Date.now()?`<span class="st te">⏳ Teste até ${new Date(ms).toLocaleDateString('pt-BR')}</span>`:'<span class="st no">⌛ Teste vencido</span>';
}
function vMaster(){
  return `<div class="mtop"><div><b>Painel do administrador</b><span>Fichas de Serviço · Keller IA</span></div><button class="lnk" style="width:auto;padding:8px" data-act="sair">Sair</button></div>
  <button class="B" data-act="novaOficina" style="margin-top:6px">➕ CADASTRAR OFICINA</button>
  <div class="h2">Oficinas (${OFICINAS.length})</div>
  ${OFICINAS.map(o=>`<div class="card" style="cursor:default">
    <div class="fic"><b>${esc(nomeCurto(o.nome)||'(sem nome)')}</b>${stTxt(o)}</div>
    <div class="s">${esc(o.email||'')}${o.cidade?' · '+esc(o.cidade):''}</div>
    <div class="acts">
      <button class="ab blue" data-act="verOficina" data-id="${o.id}">👁 Ver fichas</button>
      ${o.status!=='ativo'?`<button class="ab green" data-act="stOficina" data-id="${o.id}" data-s="ativo">✅ Liberar</button>`:''}
      <button class="ab" data-act="stOficina" data-id="${o.id}" data-s="teste">⏳ Teste ${DIAS_TESTE} dias</button>
      ${o.status!=='bloqueado'?`<button class="ab red" data-act="stOficina" data-id="${o.id}" data-s="bloqueado">⛔ Bloquear</button>`:''}
      <button class="ab" data-act="senhaOficina" data-email="${esc(o.email||'')}">🔑 Trocar senha</button>
    </div></div>`).join('')||'<div class="empty">Nenhuma oficina ainda. Toque em <b>➕ CADASTRAR OFICINA</b>.</div>'}`;
}
function modalNovaOficina(){
  const P=OFICINAS.length?{}:CONFIG_PADRAO; // a primeira já vem com os dados da MR Truck
  modal(`<h3>Cadastrar oficina</h3><form id="fOficina" autocomplete="off">
    <label>Nome da empresa</label><input name="nome" value="${esc(P.nome||'')}" required>
    <label>Frase abaixo do nome (opcional)</label><input name="slogan" value="${esc(P.slogan||'')}">
    <label>Endereço</label><input name="end1" value="${esc(P.end1||'')}"><label>Bairro</label><input name="end2" value="${esc(P.end2||'')}"><label>Cidade - UF - CEP</label><input name="end3" value="${esc(P.end3||'')}">
    <label>CNPJ</label><input name="cnpj" value="${esc(P.cnpj||'')}"><label>IE</label><input name="ie" value="${esc(P.ie||'')}">
    <label>Telefone</label><input name="fone" value="${esc(P.fone||'')}"><label>Cidade (sai no rodapé da folha)</label><input name="cidade" value="${esc(P.cidade||'')}">
    <div class="ex" style="margin-top:14px">Login que a oficina vai usar (um e-mail que ainda não tenha conta):</div>
    <label>E-mail de acesso da oficina</label><input name="email" type="email" required autocapitalize="none">
    <label>Senha (mínimo 6)</label><input name="senha" required minlength="6">
    <label>Começa como</label><select name="status" class="sel"><option value="teste">⏳ Teste de ${DIAS_TESTE} dias</option><option value="ativo">✅ Liberado</option></select>
    <div id="oErro"></div><button class="B" id="oBtn">CADASTRAR</button></form><button class="lnk" data-act="fechar">Cancelar</button>`);
}
async function cadastrarOficina(f){
  const g=k=>String(new FormData(f).get(k)||'').trim();
  const b=$('#oBtn'),err=m=>{$('#oErro').innerHTML=`<div class="err">${m}</div>`;};
  const email=g('email').toLowerCase(),senha=g('senha');
  if(senha.length<6)return err('A senha precisa ter pelo menos 6 letras ou números.');
  if(email===(USER.email||'').toLowerCase())return err('Use um e-mail da oficina, diferente do seu.');
  b.disabled=true;b.textContent='Cadastrando…';let app2;
  try{
    app2=initializeApp(firebaseConfig,'cad'+Date.now());const a2=getAuth(app2);
    const cr=await createUserWithEmailAndPassword(a2,email,senha);const donoUid=cr.user.uid;await signOut(a2);
    const id=(nomeKey(nomeCurto(g('nome'))).replace(/[^a-z0-9]+/g,'-').slice(0,20)||'oficina')+'-'+Math.random().toString(36).slice(2,6);
    const bt=writeBatch(fs);

const _cv=document.createElement('canvas').getContext('2d');
const larg=(t,font)=>{_cv.font=font;return _cv.measureText(t).width;};
// a linha "cabe" se couber na tela E na folha impressa (coluna da descrição ~575px em 13,5px)
function cabe(el,t){const cs=getComputedStyle(el),disp=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-3;
  return larg(t,`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`)<=disp&&larg(t,'13.5px Arial, Helvetica, sans-serif')<=572;}
function quebraLinha(el){
  const v=el.value;if(cabe(el,v)||el.selectionStart!==v.length)return;
  const k=el.dataset.l,i=+el.dataset.i;
  let c=v.length;while(c>1&&!cabe(el,v.slice(0,c)))c--;
  const esp=v.lastIndexOf(' ',c),pos=esp>0?esp:c;
  const fica=v.slice(0,pos).replace(/\s+$/,''),vai=v.slice(pos).replace(/^\s+/,'');
  lerItens();const a=F.itens[k];a[i].d=fica;
  if(i+1>=a.length)a.push({d:'',v:''});else if(a[i+1].d)a.splice(i+1,0,{d:'',v:''});
  a[i+1].d=vai;
  $('#L_'+k).innerHTML=linhasHTML(k);
  const nx=document.querySelector(`#L_${k} .ld[data-i="${i+1}"]`);nx.focus();nx.setSelectionRange(vai.length,vai.length);
  if(!cabe(nx,vai))quebraLinha(nx);
}

function imprimirA4(html){

let padDirty=false;
function initPad(){
  const c=$('#pad');if(!c)return;padDirty=false;
  const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.lineWidth=2.8;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0c2a80';
  let on=false,last=null;const pt=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
  c.onpointerdown=e=>{on=true;last=pt(e);try{c.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();};
  c.onpointermove=e=>{if(!on)return;const p=pt(e);g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();last=p;if(!padDirty){padDirty=true;$('#padHint').style.display='none';}};
  c.onpointerup=c.onpointercancel=()=>{on=false;};
}
function padData(){const c=$('#pad');if(!c||!padDirty)return null;const w=520,o=document.createElement('canvas');o.width=w;o.height=Math.round(w*c.height/c.width);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/png');}

/* ====== salvar ficha ====== */
function salvar(){
  lerForm();
  const er=m=>{$('#erro').innerHTML=`<div class="err">${m}</div>`;$('#erro').scrollIntoView({behavior:'smooth',block:'center'});};
  const num=String(F.num||'').trim();
  if(!num){er('Digite o <b>número da ordem de serviço</b> (Nº), lá em cima, no canto direito da folha.');setTimeout(()=>$('#iNum').focus(),400);return;}
  const rep=db.fichas.find(x=>String(pad6(x.num)).trim()===num&&x.id!==edit);
  if(rep)return er(`Já existe uma ficha com o Nº <b>${esc(num)}</b> (cliente ${esc(rep.cliente)}). Confira o número.`);
  const nome=F.cliente.trim();
  if(!nome)return er('Escreva o nome do cliente.');
  const vs=F.veiculos.map(v=>({placa:normPlaca(v.placa),modelo:String(v.modelo||'').trim(),chassi:String(v.chassi||'').trim().toUpperCase(),km:int(v.km)})).filter(v=>v.placa||v.modelo||v.chassi);
  if(!vs.length)return er('Escreva a placa do veículo.');
  for(const v of vs){
    if(v.placa.length!==7)return er(`A placa "${esc(v.placa||'(vazia)')}" está incompleta. Placa tem 7 letras/números, ex.: ABC1D23.`);
    const dono=donoDaPlaca(v.placa);
    if(dono&&nomeKey(dono.nome)!==nomeKey(nome))return er(`A placa ${v.placa} já é do cliente <b>${esc(dono.nome)}</b>. Confira o nome do cliente.`);
  }
  if(new Set(vs.map(v=>v.placa)).size!==vs.length)return er('A mesma placa está repetida na ficha.');
  let c=cliByNome(nome);if(!c){c={id:uid('c'),nome,tel:'',veiculos:[]};db.clientes.push(c);}
  c.veiculos=c.veiculos||[];
  vs.forEach(v=>{const ex=c.veiculos.find(x=>x.placa===v.placa);
    if(ex){if(v.modelo)ex.modelo=v.modelo;if(v.chassi)ex.chassi=v.chassi;if(v.km>(ex.km||0))ex.km=v.km;}
    else c.veiculos.push({...v});});
  gravaCli(c);
  const limpa=a=>{a=a.map(x=>({d:String(x.d||'').trim(),v:String(x.v||'').trim()}));let n=a.length;while(n&&!a[n-1].d&&!a[n-1].v)n--;return a.slice(0,n);};
  const iS=limpa(F.itens.servico),iP=limpa(F.itens.pecas);
  const dados={num,cid:c.id,cliente:c.nome,motorista:F.motorista.trim(),veiculos:vs,
    servico:iS.map(x=>x.d).filter(Boolean).join('\n'),pecas:iP.map(x=>x.d).filter(Boolean).join('\n'),
    servicoItens:iS,pecasItens:iP,linhasServico:F.itens.servico.length,linhasPecas:F.itens.pecas.length,total:somaItens(iS)+somaItens(iP),
    assinatura:F.assinatura||null};
  let f;
  if(edit){f=fichaById(edit);Object.assign(f,dados);}
  else{f={id:uid('f'),data:F.data,status:'aberta',fechamento:null,...dados};db.fichas.push(f);}
  gravaFicha(f);
  novoForm();tela={v:'ver',id:f.id,salvo:true};render();
  if(attPendente)setTimeout(talvezAtualizar,2500);
}

  const t=e.target;
  if(e.key==='Backspace'&&t.dataset&&t.dataset.l&&!t.dataset.v&&t.value===''&&+t.dataset.i>0){e.preventDefault();const pv=document.querySelector(`#L_${t.dataset.l} .ld[data-i="${+t.dataset.i-1}"]`);if(pv){pv.focus();const n=pv.value.length;pv.setSelectionRange(n,n);}return;}
  if(e.key!=='Enter'||!t.dataset||!t.dataset.l)return;e.preventDefault();
  const k=t.dataset.l,i=+t.dataset.i,camp=t.dataset.v?'lv':'ld';lerItens();
  if(i+1>=F.itens[k].length){F.itens[k].push({d:'',v:''});$('#L_'+k).innerHTML=linhasHTML(k);}
  const nx=document.querySelector(`#L_${k} .${camp}[data-i="${i+1}"]`);if(nx)nx.focus();
});
document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.v&&t.value.trim()){const n=money(t.value);t.value=n?brl(n):'';}});
let arr=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g)return;lerItens();arr={k:g.dataset.grip,y:e.clientY,n:F.itens[g.dataset.grip].length};try{g.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!arr)return;const k=arr.k,a=F.itens[k];lerItens();
  const cheias=a.reduce((m,x,i)=>(x.d||x.v)?i+1:m,0),n=Math.max(1,cheias,arr.n+Math.round((e.clientY-arr.y)/30));
  if(n!==a.length){while(a.length<n)a.push({d:'',v:''});a.length=n;$('#L_'+k).innerHTML=linhasHTML(k);}});
document.addEventListener('pointerup',()=>{arr=null;});
document.addEventListener('pointercancel',()=>{arr=null;});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.v){lerItens();pintaTotais();return;}
  if(t.dataset&&t.dataset.l){quebraLinha(t);return;}
  if(t.id==='iCliente'){F.cliente=t.value;$('#conhecidos').innerHTML=conhecidosHTML();return;}
  if(t.id==='busca'){$('#lista').innerHTML=listaClientes(t.value);return;}
  if(t.dataset&&t.dataset.k==='placa'){
    const hb=t.closest('.vei').querySelector('.histbox');if(hb)hb.innerHTML=histHint(normPlaca(t.value));
    const p=normPlaca(t.value);if(p.length!==7)return;const dono=donoDaPlaca(p);if(!dono)return;
    const v=dono.veiculos.find(x=>x.placa===p),box=t.closest('.vei');
    const m=box.querySelector('[data-k=modelo]'),c=box.querySelector('[data-k=chassi]');
    if(!m.value)m.value=v.modelo||'';if(!c.value)c.value=v.chassi||'';
    if(!$('#iCliente').value.trim()){$('#iCliente').value=dono.nome;F.cliente=dono.nome;$('#conhecidos').innerHTML=conhecidosHTML();}
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,Fd=new FormData(f),g=k=>String(Fd.get(k)||'').trim();
  if(f.id==='fLogin'){
    const em=$('#lEmail').value.trim().toLowerCase(),se=$('#lSenha').value,b=$('#lBtn');$('#lErro').innerHTML='';
    b.disabled=true;b.textContent='Entrando…';
    try{await signInWithEmailAndPassword(auth,em,se);}
    catch(er){$('#lErro').innerHTML=`<div class="err">${erroTxt(er)}</div>`;b.disabled=false;b.textContent='ENTRAR';}
    return;}
  if(f.id==='fOficina'){cadastrarOficina(f);return;}
  if(f.id==='fCfg'){const C=db.config;['nome','slogan','end1','end2','end3','cnpj','ie','fone','cidade'].forEach(k=>C[k]=g(k));gravaConfig();closeModal();render();toast('Salvo');return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='logoIn'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,360/im.width),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.config.logo=c.toDataURL('image/png');gravaConfig();closeModal();render();toast('Logo colocada');};im.src=r.result;};r.readAsDataURL(t.files[0]);}
});

/* ====== instalar como aplicativo (computador / Android) ====== */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let pedidoInstalar=null;
const ehCelular=/Android|iPhone|iPad/i.test(navigator.userAgent);
const ehIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ehEdge=/Edg\//.test(navigator.userAgent),ehChrome=/Chrome\//.test(navigator.userAgent)&&!ehEdge&&!/OPR\//.test(navigator.userAgent);
const jaInstalado=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const KEY_NAO='mrtruck_naoInstalar_ate';
const escondido=()=>{try{return +localStorage.getItem(KEY_NAO)>Date.now();}catch(_){return false;}};
const pedeInstalar=new URLSearchParams(location.search).has('instalar');
function mostraBotaoInstalar(){
  if(jaInstalado()||(escondido()&&!pedeInstalar))return;
  const b=$('#instalar');b.querySelector('span').textContent=ehCelular?'📱 Instalar no celular':'💻 Instalar no computador';b.classList.add('show');
}
function comoInstalar(){
  const link=location.origin+location.pathname;
  let passos;
  if(ehIOS)passos=`<li>Abra este link no <b>Safari</b>.</li><li>Toque no botão <b>Compartilhar</b> (quadrado com a setinha para cima).</li><li>Toque em <b>"Adicionar à Tela de Início"</b> e depois em <b>Adicionar</b>.</li>`;
  else if(ehCelular)passos=`<li>Abra este link no <b>Google Chrome</b>.</li><li>Toque nos <b>três pontinhos ⋮</b> no canto de cima.</li><li>Toque em <b>"Instalar app"</b> ou <b>"Adicionar à tela inicial"</b>.</li>`;
  else if(ehEdge)passos=`<li>Clique nos <b>três pontinhos ⋯</b> no canto de cima.</li><li>Vá em <b>Aplicativos</b> → <b>"Instalar este site como aplicativo"</b>.</li><li>Clique em <b>Instalar</b>.</li>`;
  else if(ehChrome)passos=`<li>Na barra de endereço lá em cima, no canto direito, clique no ícone de <b>monitor com uma setinha</b>.</li><li>Ou clique nos <b>três pontinhos ⋮</b> → <b>"Transmitir, salvar e compartilhar"</b> → <b>"Instalar página como app"</b>.</li><li>Clique em <b>Instalar</b>.</li>`;
  else passos=`<li>Este navegador não instala aplicativos.</li><li>Abra o link abaixo no <b>Google Chrome</b> ou no <b>Microsoft Edge</b> e clique em <b>"Instalar no computador"</b>.</li>`;
  modal(`<h3>💻 Instalar o sistema</h3>
    ${pedidoInstalar?`<button class="B" data-act="instalarAgora" style="min-height:76px;font-size:22px">✅ INSTALAR AGORA</button><p style="color:var(--mut);margin:10px 0 4px;font-size:15px">Se não funcionar, faça assim:</p>`:''}
    <ol style="padding-left:22px;font-size:17px;line-height:1.6;margin:8px 0 12px">${passos}</ol>
    <p style="font-size:14.5px;color:var(--mut)">Se lá em cima aparecer <b>"Abrir no app"</b>, ele já está instalado: é só clicar ali. Depois de instalado, aparece o ícone <b>MR Truck</b> na área de trabalho.</p>
    <div class="ex" style="user-select:all;word-break:break-all;margin-top:10px">${esc(link)}</div>
    <button class="lnk" data-act="fechar">Fechar</button>`);
}
async function instalarAgora(){
  if(!pedidoInstalar){comoInstalar();return;}
  pedidoInstalar.prompt();const r=await pedidoInstalar.userChoice;pedidoInstalar=null;$('#instalar').classList.remove('show');closeModal();
  if(r.outcome==='accepted')toast('✅ Instalado! Procure o ícone MR Truck na área de trabalho');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInstalar=e;mostraBotaoInstalar();if(pedeInstalar&&!$('#modal').classList.contains('show'))comoInstalar();});
$('#instalar').addEventListener('click',e=>{
  if(e.target.id==='instalarX'){$('#instalar').classList.remove('show');try{localStorage.setItem(KEY_NAO,String(Date.now()+3*864e5));}catch(_){}return;}
  instalarAgora();});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='instalarApp'){e.stopPropagation();pedidoInstalar?instalarAgora():comoInstalar();}
  if(el.dataset.act==='instalarAgora'){e.stopPropagation();instalarAgora();}},true);
window.addEventListener('appinstalled',()=>{$('#instalar').classList.remove('show');closeModal();toast('✅ Instalado!');});
// link de instalação (…/mrtruck/?instalar): se o navegador não oferecer o botão em 3 s, mostra o passo a passo
if(pedeInstalar&&!jaInstalado())setTimeout(()=>{if(!pedidoInstalar&&!$('#modal').classList.contains('show'))comoInstalar();},3000);
// mesmo sem o aviso automático do navegador, o botão aparece (abre o passo a passo)
setTimeout(()=>{if(!pedidoInstalar&&!jaInstalado()&&!ehIOS)mostraBotaoInstalar();},4000);
/* ====== atualização automática ======
   Cada publicação muda APP_VERSAO e o arquivo version.json. O sistema aberto confere de tempos em tempos
   e se recarrega sozinho; se houver uma ficha sendo preenchida, espera ela ser salva. */
const APP_VERSAO='v15';
let attPendente=false;
function temDigitacao(){
  if($('#modal').classList.contains('show'))return true;
  if(!['nova','cliente'].includes(tela.v))return false;
  return [...document.querySelectorAll('#app input:not([readonly]),#app textarea')].some(i=>i.type!=='file'&&String(i.value||'').trim()!=='');
}
let versaoNova='';
function recarregar(){
  // abre o endereço com ?v=versão nova: assim vem a página nova do servidor, sem pegar a guardada
  const k='mrtruck_tentou_'+versaoNova;let n=0;try{n=+sessionStorage.getItem(k)||0;if(n>=2)return;sessionStorage.setItem(k,String(n+1));sessionStorage.setItem('mrtruck_atualizado','1');}catch(_){}
  const go=()=>location.replace(location.pathname+'?v='+encodeURIComponent(versaoNova||Date.now()));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}).finally(()=>setTimeout(go,300));else go();
}
function talvezAtualizar(){if(!attPendente)return;if(temDigitacao()){$('#attbar').style.display='block';return;}recarregar();}
async function checaVersao(){
  if(APP_VERSAO.startsWith('__'))return;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    if(j.v&&j.v!==APP_VERSAO){versaoNova=j.v;attPendente=true;talvezAtualizar();}}catch(_){}
}
setInterval(checaVersao,3*60*1000);
setInterval(talvezAtualizar,20*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checaVersao();});
window.addEventListener('focus',checaVersao);
setTimeout(checaVersao,8000);
document.addEventListener('click',e=>{const el=e.target.closest('[data-act=atualizarJa]');if(el){e.stopPropagation();recarregar();}},true);
if(new URLSearchParams(location.search).has('v'))history.replaceState(null,'',location.pathname);
try{if(sessionStorage.getItem('mrtruck_atualizado')){sessionStorage.removeItem('mrtruck_atualizado');setTimeout(()=>toast('✅ Sistema atualizado'),1500);}}catch(_){}
window.addEventListener('afterprint',()=>{$('#printArea').innerHTML='';});
render();
</script>
</body>
