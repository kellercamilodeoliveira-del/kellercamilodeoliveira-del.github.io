<style>
:root{--azul:#0B4F9C;--verde:#1E7A3C;--cinza:#BFBFBF;--cinza2:#E4E4E4;--preto:#1a1a1a;--ok:#23794A;--nc:#C62828;--na:#6B7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111;font-size:15px;line-height:1.35;padding-bottom:90px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:1px}
header{background:#fff;border-bottom:2px solid var(--preto);position:sticky;top:0;z-index:20}
.topo{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 4px;max-width:900px;margin:0 auto}
.topo b{font-size:19px;color:var(--azul)}
.topo small{color:#666;font-size:13px}
.topo-dir{display:flex;align-items:center;gap:10px}
.rede{font-size:12px;font-weight:bold;padding:3px 8px;border-radius:20px;background:#e6f2ea;color:var(--ok);white-space:nowrap}
.rede.off{background:#fdecea;color:var(--nc)}
.usu{display:flex;align-items:center;gap:8px;font-size:13px;color:#444}
.usu button{border:1px solid #999;background:#fff;border-radius:3px;padding:4px 8px;font-size:12px;font-weight:bold}
.login{max-width:420px;margin:30px auto;border:2px solid var(--preto);padding:22px}
.login h1{font-size:24px;margin-bottom:4px}.login p{color:#555;font-size:14px;margin-bottom:16px}
.login label,.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold;margin-bottom:12px}
.login input,.form input{border:1px solid #888;border-radius:3px;padding:11px;font-size:16px;font-weight:normal}
.login .btn{width:100%;margin-top:4px}
.link{background:none;border:0;color:var(--azul);text-decoration:underline;font-size:14px;padding:10px 0;display:block}
.erro{color:var(--nc);font-weight:bold;font-size:14px;min-height:20px;margin:6px 0}
.form{border:2px solid var(--preto);padding:14px;margin:12px 0}
.form h2{font-size:17px;margin-bottom:12px}
.form .chk{flex-direction:row;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.emp{border:1px solid var(--preto);margin-top:8px;padding:12px}
.emp .topo-emp{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.emp small{color:#555}
.empsel{padding:8px;border-bottom:1px solid var(--preto);background:#eef4fb;font-size:13px;font-weight:bold}
.empsel select{margin-top:4px}
.pill.pend{background:#6B7280}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.instalar{display:none;max-width:900px;margin:10px auto 0;padding:0 10px}
.instalar div{border:2px solid var(--azul);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 10px;max-width:900px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:#444;padding:10px 12px 11px;font-weight:bold;font-size:14px;border-bottom:4px solid transparent;white-space:nowrap}
nav button.on{color:var(--azul);border-bottom-color:var(--azul)}
nav button.painel{margin-left:auto}
main{max-width:900px;margin:0 auto;padding:14px 10px}
h1{font-size:20px;font-weight:bold}
.ref{color:#555;font-size:14px;margin:4px 0 12px}
.folha{border:2px solid var(--preto);background:#fff}
.cab{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--preto)}
.cab-mid{text-align:center;padding:0 8px}
.marca{font-weight:bold;font-size:20px;color:var(--azul);display:block}
.marca.gers{color:var(--verde);font-size:15px}
.cab-mid h1{margin-top:2px}
.cab-logo{height:52px;width:52px;object-fit:contain;display:block}
.cab-logo:first-child{margin-left:6px}
.cab-logo:last-child{margin-right:6px}
@media(max-width:480px){.cab-logo{height:38px;width:38px}.marca{font-size:15px}.marca.gers{font-size:12px}}
.cab h1{text-align:center;font-size:19px}
.campos{display:grid;grid-template-columns:1fr 1fr}
.campos label{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--preto);padding:5px 8px;font-size:13px;font-weight:bold;white-space:nowrap}
.campos label:nth-child(odd){border-right:1px solid var(--preto)}
.campos input{flex:1;min-width:0;border:0;border-bottom:1px dotted #aaa;padding:5px 2px;font-size:15px;font-weight:normal;background:transparent}
.gps{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--preto)}
.gps span{font-size:13px;color:#444}.gps a{color:var(--azul)}
.btn{border:1px solid var(--preto);border-radius:3px;padding:10px 14px;font-weight:bold;background:#fff}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.ama{background:var(--cinza2)}
.btn.sec{background:#fff}
.faixa{background:var(--cinza);text-align:center;font-weight:bold;padding:6px;border-bottom:1px solid var(--preto);font-size:14px}
.aviso{padding:7px 10px;border-bottom:1px solid var(--preto);font-size:13px;background:#fafafa}
.th{display:grid;grid-template-columns:34px 1fr 52px;background:var(--cinza2);border-bottom:1px solid var(--preto);font-weight:bold;font-size:13px}
.th span{padding:6px 4px;text-align:center}.th span+span{border-left:1px solid var(--preto)}
ol{list-style:none}
.it{display:grid;grid-template-columns:34px 1fr 52px;border-bottom:1px solid var(--preto)}
.it>div{padding:7px 6px}
.n{font-weight:bold;text-align:center;border-right:1px solid var(--preto)}
.tx{font-size:14px}
.prc{background:var(--cinza2);border-left:1px solid var(--preto);text-align:center;font-weight:bold;font-size:13px}
.seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 8px 8px 40px!important}
.seg button{border:1px solid #888;background:#fff;border-radius:3px;padding:8px 0;font-weight:bold}
.seg button[data-v=C].on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-v=NC].on{background:var(--nc);border-color:var(--nc);color:#fff}
.seg button[data-v=NA].on{background:var(--na);border-color:var(--na);color:#fff}
.it.s-NC{background:#fff3f2}
.ncbox{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;padding:0 8px 9px 40px!important}
.ncbox p{font-size:13px;font-weight:bold;color:var(--nc)}
.ncbox input{border:1px solid #d9a9a5;border-radius:3px;padding:8px;font-size:15px;background:#fff}
.okbox{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;padding:0 8px 9px 40px!important}
.fotos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fotos figure{position:relative;width:78px;height:78px;border:1px solid var(--preto)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos figure button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--nc);color:#fff;font-weight:bold;line-height:1}
.btn.foto{display:inline-flex;align-items:center;gap:6px;background:#fff;font-size:14px;padding:9px 12px}
.carregando{font-size:13px;color:#555}
.legenda{text-align:center;font-size:12px;font-weight:bold;padding:7px 8px;border-bottom:1px solid var(--preto)}
.obs-t{font-weight:bold;text-decoration:underline;font-size:13px;padding:7px 8px 4px}
textarea{width:100%;min-height:110px;border:0;padding:6px 8px;font-size:15px;line-height:26px;background:repeating-linear-gradient(#fff 0 25px,#999 25px 26px);border-bottom:1px solid var(--preto)}
.rodape{display:grid;grid-template-columns:1fr auto 1.4fr;font-size:12px;color:#777;text-align:center}
.rodape span{padding:5px}.rodape span+span{border-left:1px solid var(--preto)}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--preto);z-index:15}
.barra div{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.prog{flex:1}.prog small{font-size:13px;color:#444}
.trilho{height:8px;background:var(--cinza2);overflow:hidden;margin-top:4px}
.trilho i{display:block;height:100%;background:var(--azul);transition:width .2s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modal>div{background:#fff;width:100%;max-width:560px;border-top:3px solid var(--azul);padding:20px;max-height:88vh;overflow:auto}
.res{font-size:24px;font-weight:bold;padding:10px 14px;color:#fff;margin-bottom:10px}
.res.lib{background:var(--ok)}.res.blo{background:var(--nc)}.res.pen{background:#B7791F}
.modal ul{margin:10px 0 16px 18px;font-size:15px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--preto);margin:12px 0}
.kpis div,.kpis button{padding:10px;border-right:1px solid var(--preto)}.kpis div:last-child,.kpis button:last-child{border-right:0}
.kpis b{font-size:26px;display:block}.kpis span{font-size:13px;color:#444}
.kpis .alerta b{color:var(--nc)}
.kpis button{background:none;border-top:0;border-bottom:0;border-left:1px solid var(--preto);text-align:left;font:inherit;width:100%;cursor:pointer}
.kpis button.on{background:var(--azul);outline:2px solid var(--azul)}
.kpis button.on b,.kpis button.on span{color:#fff}
.kpis button.on.alerta b{color:#fff}
.filtro-limpar{display:inline-block;margin:0 0 10px;font-size:13px;color:var(--azul);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
select{border:1px solid var(--preto);padding:9px;background:#fff;width:100%}
.reg{border:1px solid var(--preto);margin-top:8px}
.reg>button{width:100%;text-align:left;background:none;border:0;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.reg strong{display:block}.reg small{color:#555}
.pill{font-size:12px;font-weight:bold;padding:3px 8px;color:#fff;white-space:nowrap}
.pill.lib{background:var(--ok)}.pill.blo{background:var(--nc)}.pill.pen{background:#B7791F}
.relat-graf{display:flex;gap:22px;align-items:center;flex-wrap:wrap;border:2px solid var(--preto);padding:16px;margin:12px 0}
.pizza{width:150px;height:150px;border-radius:50%;flex:0 0 auto}
.legenda-pz{list-style:none;font-size:14px}
.legenda-pz li{display:flex;align-items:center;gap:8px;margin:6px 0}
.legenda-pz i{width:13px;height:13px;border-radius:3px;display:inline-block;flex:0 0 auto}
.parados{border:2px solid var(--preto);margin:12px 0}
.parados h2{font-size:16px;padding:10px 12px;border-bottom:1px solid var(--preto)}
.parados table{width:100%;border-collapse:collapse;font-size:14px}
.parados td{padding:8px 12px;border-bottom:1px solid #ddd}
.parados td:last-child{text-align:right;white-space:nowrap;font-weight:bold;color:var(--nc)}
.det{padding:0 12px 12px;font-size:14px;border-top:1px solid var(--preto)}
.det table{width:100%;border-collapse:collapse;margin:8px 0}
.det td{border-bottom:1px solid #ccc;padding:7px 4px;vertical-align:top}
.venc{color:var(--nc);font-weight:bold}.okx{color:var(--ok);font-weight:bold}
.vazio{text-align:center;padding:40px 10px;color:#555}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;z-index:40;font-size:15px;max-width:90%}
@media(max-width:600px){.campos{grid-template-columns:1fr}.campos label:nth-child(odd){border-right:0}.kpis{grid-template-columns:1fr 1fr}.kpis div:nth-child(2){border-right:0}.kpis div:nth-child(-n+2){border-bottom:1px solid var(--preto)}.cab h1{font-size:17px}.rodape{grid-template-columns:1fr}.rodape span+span{border-left:0;border-top:1px solid var(--preto)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,.barra,.acoes,.seg{display:none}}
</style>
</head>

const idb={db:null,
 abrir(){return this.db||(this.db=new Promise((ok,er)=>{const r=indexedDB.open('checklist-frota-teste',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}))},
 async op(modo,fn){const db=await this.abrir();return new Promise((ok,er)=>{const tx=db.transaction('kv',modo);const req=fn(tx.objectStore('kv'));tx.oncomplete=()=>ok(req?req.result:undefined);tx.onerror=()=>er(tx.error)})}
};
const mem={};
const store={
 async get(k){try{const v=await idb.op('readonly',s=>s.get(k));return v??null}catch(e){}try{if(window.storage){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null}}catch(e){}return mem[k]??null},
 async set(k,v){mem[k]=v;try{await idb.op('readwrite',s=>s.put(v,k));return}catch(e){}try{if(window.storage)await window.storage.set(k,JSON.stringify(v),false)}catch(e){console.error(e)}},
 async del(k){delete mem[k];try{await idb.op('readwrite',s=>s.delete(k));return}catch(e){}try{if(window.storage)await window.storage.delete(k,false)}catch(e){}}
};

const diasEntre=(isoOuTs,fimTs)=>{const ini=typeof isoOuTs==='string'?new Date(isoOuTs+'T12:00').getTime():isoOuTs;return Math.max(0,Math.floor((fimTs-ini)/86400000))};
function dadosRelatorio(){
 const lista=registros.filter(r=>(filtro==='todos'||r.ck===filtro)&&(filtroEmp==='todas'||r.empresaId===filtroEmp));
 const mesAtual=hojeISO().slice(0,7);
 const doMes=lista.filter(r=>(r.cab.data||'').slice(0,7)===mesAtual);
 const cont={lib:0,pen:0,blo:0};
 doMes.forEach(r=>cont[statusReg(r)[0]]++);
 const tot=doMes.length||1;
 const pLib=cont.lib/tot*100,pPen=cont.pen/tot*100,pBlo=cont.blo/tot*100;
 const agora=Date.now();
 const parados=[];
 lista.forEach(r=>{const abertos=r.ncs.filter(x=>!x.ok);if(!abertos.length)return;
  const dias=diasEntre(r.cab.data,agora);if(dias>2)parados.push({r,dias,n:abertos.length})});
 parados.sort((a,b)=>b.dias-a.dias);
 return{doMes,cont,tot,pLib,pPen,pBlo,parados,mesAtual};
}

async function criarLogin(empresaId,email,senha){
 const app2=initializeApp(firebaseConfig,'cadastro'+Date.now());
 try{const a2=getAuth(app2);const cred=await createUserWithEmailAndPassword(a2,email,senha);
  await setDoc(doc(db,'usuarios',cred.user.uid),{empresaId,email:email.toLowerCase(),criadoEm:Date.now()});await signOut(a2)}
 finally{deleteApp(app2).catch(()=>{})}
}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function resumo(r){
 const ck=ckDe(r.ck),[,l]=statusReg(r);
 let s=`Checklist ${ck.nome}\n${rotuloFrota(ck)}: ${r.cab.frota}  Data: ${fmt(r.cab.data)}\nVistoriador: ${r.cab.vistoriador}\n${r.inicio?`Início: ${dh(r.inicio)}  Término: ${dh(r.fim)}  Duração: ${dur(r.fim-r.inicio)}\n`:''}Resultado: ${l.toUpperCase()}  Nota: ${notaReg(r)}\nConformes ${r.c}, não conformes ${r.ncs.length}, N/A ${r.na}`;
 if(r.ncs.length)s+='\n\nNão conformidades:\n'+r.ncs.map(x=>`- ${x.sec} ${x.n}. ${x.t} (${prTxt(x.pr)})${x.ok?' [regularizado]':''}${x.o?': '+x.o:''}`).join('\n');
 if(r.gps)s+=`\n\nLocal: https://maps.google.com/?q=${r.gps.lat},${r.gps.lng}`;
 return s;
}
async function compartilhar(r){
 const t=resumo(r);
 try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(t);toast('Resumo copiado. Cole no WhatsApp ou e-mail.')}catch(e){prompt('Copie o resumo:',t)}
}

const fotosCache={};
async function comprimir(file,frota){
 const url=URL.createObjectURL(file),img=new Image();
 await new Promise((ok,er)=>{img.onload=ok;img.onerror=er;img.src=url});
 const f=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');
 c.width=Math.round(img.width*f);c.height=Math.round(img.height*f);
 const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
 const tx=new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+(frota?'  |  Frota '+frota:'');
 const h=Math.max(22,Math.round(c.width/28));g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,c.height-h*1.5,c.width,h*1.5);
 g.fillStyle='#fff';g.font=`bold ${h}px Arial`;g.fillText(tx,h*.5,c.height-h*.45);
 return c.toDataURL('image/jpeg',.62);
}
async function gerarPDF(reg,btn){
 if(!window.jspdf){toast('Abra o app uma vez com internet para ativar o PDF. Depois ele funciona offline.');return}
 const txt0=btn&&btn.textContent;if(btn){btn.textContent='Gerando...';btn.disabled=true}
 try{
 let fotos=fotosCache[reg.id];
 if(!fotos){fotos={};try{const q=await getDocs(query(collection(db,'fotos'),where('empresaId','==',reg.empresaId),where('inspId','==',reg.id)));
  q.docs.map(x=>x.data()).sort((a,b)=>a.idx-b.idx).forEach(x=>(fotos[x.k]||(fotos[x.k]=[])).push(x.data))}catch(e){console.error(e)}fotosCache[reg.id]=fotos}
 const ck=ckDe(reg.ck),{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
 const L=12,R=198,W=R-L,lim=282;let y=12;
 const cl=t=>String(t??'').replace(/−/g,'-');
 const azul=[11,79,156],cinza=[191,191,191],cinza2=[228,228,228];
 const [,cod,rev]=ck.ref.split(', ');
 const rod=ck.gers?'GERS FLORESTAL   |   Revisão 01   |   Elaborador: Thiago Gomes':`${cod}   |   Revisão ${rev.replace('revisão ','')}   |   Documento de Referência: PR.FLO.BSP.118`;
 const novaPag=()=>{doc.addPage();y=12};
 const cabeca=()=>{
  doc.setDrawColor(0);doc.setLineWidth(.4);doc.rect(L,y,W,14);
  try{doc.addImage(LOGO_GERS,'PNG',L+1.5,y+2,10,10)}catch(e){}
  try{doc.addImage(LOGO_HISTORIA,'PNG',L+W-1.5-13.9,y+2.5,13.9,10)}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(ck.gers?8:10);doc.setTextColor(...(ck.gers?[30,122,60]:azul));
  doc.text(ck.gers?'GERS FLORESTAL':'Bracell',L+W/2,y+4.5,{align:'center'});
  doc.setTextColor(0);doc.setFontSize(10.5);doc.text('CHECKLIST - '+ck.nome.replace(/\s*\([^)]*\)\s*$/,'').toUpperCase(),L+W/2,y+10.5,{align:'center'});y+=14;
 };
 cabeca();
 // campos
 const cs=campos(ck).map(([k,l])=>[l.replace(' *',''),k==='data'?fmt(reg.cab.data):(reg.cab[k]||'')]);
 doc.setFontSize(8);doc.setLineWidth(.2);
 for(let i=0;i<cs.length;i+=2){
  [cs[i],cs[i+1]].forEach((c,j)=>{if(!c)return;const x=L+j*W/2;doc.rect(x,y,W/2,6);doc.setFont('helvetica','bold');doc.text(c[0]+':',x+2,y+4);const lw=doc.getTextWidth(c[0]+': ');doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(cl(c[1]),W/2-lw-4)[0]||'',x+2+lw,y+4)});
  y+=6;}
 const tempos=reg.inicio?[['Início',dh(reg.inicio)],['Término',dh(reg.fim)],['Duração',dur(reg.fim-reg.inicio)]]:[['Hora do registro',reg.hora||'']];
 const cw=W/tempos.length;doc.rect(L,y,W,6);
 tempos.forEach(([a,b],i)=>{const x=L+i*cw;if(i)doc.line(x,y,x,y+6);doc.setFont('helvetica','bold');doc.text(a+':',x+2,y+4);doc.setFont('helvetica','normal');doc.text(b,x+3+doc.getTextWidth(a+': '),y+4)});y+=6;

function desenharPizza(doc,cx,cy,r,fatias){
 let ang=-90;
 fatias.forEach(f=>{
  if(f.pct<=0)return;
  const ang2=ang+f.pct*3.6;doc.setFillColor(...f.cor);
  const passo=3,steps=Math.max(1,Math.ceil((ang2-ang)/passo));
  for(let i=0;i<steps;i++){
   const a1=(ang+(ang2-ang)*i/steps)*Math.PI/180,a2=(ang+(ang2-ang)*(i+1)/steps)*Math.PI/180;
   doc.triangle(cx,cy,cx+r*Math.cos(a1),cy+r*Math.sin(a1),cx+r*Math.cos(a2),cy+r*Math.sin(a2),'F');
  }
  ang=ang2;
 });
}
